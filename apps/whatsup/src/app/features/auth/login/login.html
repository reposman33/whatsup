<div class="flex h-screen justify-center items-center">
  <div class="flex flex-col bg-paper text-ink w-[550px] px-12 py-9 gap-4 rounded-md shadow-card">

    <div class="text-center text-3xl flex justify-center gap-2">
      <span class="material-symbols-outlined text-2xl text-link">forum</span>
      <h1>WhatsUp</h1>
    </div>

    <div class="flex justify-end gap-2">
      <label for="email" class="flex items-center">Email</label>
      <input
        id="email"
        type="email"
        class="login-input"
        (input)="email.set($event.target.value)"
        [value]="email()"
        (focus)="errorText.set('')"
        placeholder="name@example.com"
        #inputEmail
      />
    </div>

    <div class="flex justify-between gap-2">
      <label for="password" class="flex items-center">Password</label>
      <input
        id="password"
        type="password"
        (input)="password.set($event.target.value)"
        [value]="password()"
        class="login-password"
        placeholder="Password"
      />
    </div>

    @if(isRegistering()) {
    <div class="flex justify-between gap-2">
      <label for="naam" class="flex items-center">Naam</label>
      <input
        id="naam"
        type="text"
        (input)="naam.set($event.target.value)"
        [value]="naam()"
        class="register-naam"
      />
    </div>
  }

    <div class="flex flex-col">
      @if(errorText()) {<div class="text-s text-red-500 self-center">{{errorText()}}</div>}
      <div class="flex justify-between gap-1">
        <app-button (click)="register()" [isDisabled]="isRegistering() && !isRegistrationValid()">Register</app-button>
        <app-button (click)="isRegistering() ? isRegistering.set(false) : login()" [isDisabled]="!isLoginValid() && !isRegistering()">
          {{isRegistering() ? 'Terug naar Sign In' : 'Sign In'}}
        </app-button>
      </div>
      <!-- <button
        class="bg-dusk border border-gray-300 text-paper hover:bg-dusk/50 hover:cursor-pointer transition-colors duration-300 px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:text-gray-400"
        [disabled]="isRegistering() && !isRegistrationValid()"
        (click)="register()"
      >Register</button>
      <button
        class="bg-dusk border border-gray-300 text-paper hover:bg-dusk/50 hover:cursor-pointer transition-colors duration-300 px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:text-gray-400"
        [disabled]="!isLoginValid() && !isRegistering()"
        (click)="isRegistering() ? isRegistering.set(false) : login()"
      >{{isRegistering() ? 'Terug naar Sign In' : 'Sign In'}}</button> -->
  </div>

</div>
