<div class="flex h-screen justify-center items-center">
  <div class="flex flex-col bg-paper text-ink w-[550px] px-12 py-9 gap-4 rounded-md shadow-card">

    <div class="text-center text-3xl flex justify-center gap-2">
      <span class="material-symbols-outlined text-2xl text-link" style="width:24px; height:24px;">forum</span>
      <h1>WhatsUp</h1>
    </div>

    <div class="flex justify-end gap-2">
      <label for="email" class="flex items-start mr-2 mt-3">Email</label>
      <input
        id="email"
        type="email"
        class="login-input"
        (input)="email.set($event.target.value)"
        [value]="email()"
        (focus)="errorText.set('')"
        placeholder="name@example.com"
        #inputEmail
      />
    </div>

    <div class="flex justify-between gap-2">
      <label for="password" class="flex items-start mr-2 mt-3">Password</label>
      <input
        id="password"
        type="password"
        (input)="password.set($event.target.value)"
        [value]="password()"
        class="login-password"
        placeholder="Password"
      />
    </div>

    @if(isRegistering()) {
    <div class="flex justify-between gap-2">
      <label for="naam" class="flex items-center">Naam</label>
      <input
        id="naam"
        type="text"
        (input)="naam.set($event.target.value)"
        [value]="naam()"
        class="register-naam"
      />
    </div>
  }

    <div class="flex flex-col">
      @if(errorText()) {<div class="text-s text-red-500 self-center">{{errorText()}}</div>}
      <div class="flex justify-between gap-1">
        <app-button (click)="register()" [isDisabled]="isRegistering() && !isRegistrationValid()">Register</app-button>
        <app-button (click)="isRegistering() ? isRegistering.set(false) : login()"
        [isDisabled]="!isLoginValid() && !isRegistering()"
        [id]="isRegistering() ? 'registreer' : 'login'">
          {{isRegistering() ? 'Terug naar Sign In' : 'Sign In'}}
        </app-button>
      </div>
  </div>

</div>
