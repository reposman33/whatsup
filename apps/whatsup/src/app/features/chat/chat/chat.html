<section
    class="w-3/5 rounded-xl p-3 mb-3"
    [class]="authService.currentContact()!.name === chat().sender ? 'float-left bg-blue-200' : 'float-right bg-blue-100'">
    <div class="text-xs italic brightness-50 text-right">{{chat().sender}} op {{chat().timeStamp | date:"EEEE dd MMMM yyyy 'om' hh:mm:ss":"":"nl"}}</div>
    
    {{chat().content}}
</section>
