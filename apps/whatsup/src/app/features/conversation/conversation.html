<div #conversationContainer class="flex flex-col overflow-y-auto min-h-0 h-[600px] flex-1">
  @if(chatService.messages.isLoading()) {
    ... de chats laden...
  }
  @else if(chatService.messages.error()) {
    ERROR messages ophalen!
  }
  @else {
    @for(message of chatService.messages.value(); track $index) {
      <chat [chat]="message"></chat>
    }
  }
</div>
