<div
  class="flex flex-col justify-center items-center bg-list-group-active hover:brightness-150 transition-color w-24 h-24 p-1 rounded-full text-sm text-center border-2 border-border"
  [class]="{'brightness-175': selectedGroupId() === id(), 'bg-list-group-pending': status() === 'pending'}"
  (click)="onSelectGroup(id())"
  (keyup)="onSelectGroup(id())"
  tabindex="0"
  [attr.title]="description()"
  >
  {{ naam() }}

  @if(status() === 'pending') {
  <div class="flex justify-center gap-2 w-full">
    <span class="text-primary text-section-title hover:cursor-pointer"
    (click)="acceptInvitation(invitationId())"
    (keyup)="acceptInvitation(invitationId())"
    tabindex="0"
    title="Accepteer uitnodiging om deel te nemen aan groep">&#128522;</span>
    <span class="text-primary text-section-title hover:cursor-pointer"
    (click)="declineInvitation(invitationId())"
    (keyup)="declineInvitation(invitationId())"
    tabindex="0"
    title="Negeer uitnodiging om deel te nemen aan groep">&#128542;</span>
  </div>}
</div>
