<div
  tabindex="0"
  class="flex flex-col justify-around items-center bg-list-group-active hover:brightness-150 transition-all w-24 h-24 p-2 rounded-full text-sm text-center border-2 border-border"
  [attr.title]="description()"
  [class]="{'brightness-175': selectedGroupId() === id(), 'bg-list-group-pending': status() === 'pending'}"
  (click)="onSelectGroup(id())"
  (keyup)="onSelectGroup(id())"
  >
  {{ naam() }}

  @if(status() === 'pending') {
  <div class="flex justify-center gap-2 w-full">
    <span class="text-primary text-section-title hover:cursor-pointer"
    aria-label="Accepteer uitnodiging om deel te nemen aan groep"
    tabindex="0"
    title="Accepteer uitnodiging om deel te nemen aan groep"
    (click)="acceptInvitation({$event: $event, invitationId: invitationId()})"
    (keyup)="acceptInvitation({$event: $event, invitationId: invitationId()})">&#128522;</span>
    <span class="text-primary text-section-title hover:cursor-pointer"
    aria-label="Negeer uitnodiging om deel te nemen aan groep"
    tabindex="0"
    title="Negeer uitnodiging om deel te nemen aan groep"
    (click)="declineInvitation({$event: $event, invitationId: invitationId()})"
    (keyup)="declineInvitation({$event: $event, invitationId: invitationId()})">&#128542;</span>
  </div>}

  @else {
    <div class="flex justify-around gap-2 w-full">
      <button
        aria-label="Verwijder deze groep"
        class="hover:scale-110 hover:text-action-primary-hover transition-all."
        title="Verwijder deze groep"
        (click)="deleteGroupMembership({$event: $event, groupId: id()})">&#x1F5D1;</button>
      <button
        aria-label="Bewerk deze groep"
        class="hover:scale-110 hover:text-action-primary-hover transition-all."
        title="Bewerk deze groep"
        (click)="onEditGroup({$event: $event, groupId: id()})">&#x270E;</button>
    </div>
  }
</div>
