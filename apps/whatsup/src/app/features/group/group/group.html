<div
  class="flex justify-center items-center bg-list-group-active hover:brightness-150 transition-color hover:cursor-pointer w-24 h-24 p-1 rounded-full text-sm text-center"
  [class]="{'brightness-175': chatService.selectedGroupId() === id(), 'bg-list-group-pending': status() === 'pending'}"
  (click)="handleSelectGroup(id())"
  (keyup)="handleSelectGroup(id())"
  tabindex="0"
  [attr.title]="description()"
  >
  {{ naam() }}

  <!-- TODO: vervang door X, √ door svg / smileys -->
  @if(status() === 'pending') {
  <div class="flex justify-center gap-2 w-full">
    <span class="text-primary text-section-title hover:cursor-pointer"
    (click)="acceptInvitation(invitationId())">X</span>
    <span class="text-primary text-section-title hover:cursor-pointer"
    (click)="declineInvitation(invitationId())">√</span>
  </div>}
</div>
