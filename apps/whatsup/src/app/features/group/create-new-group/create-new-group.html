<div class=" inset-0 z-20 flex justify-center items-center">
  <div class="w-full bg-paper text-ink rounded-md px-12 pt-12 pb-3 shadow-card">
  
    <div class="flex space-between items-center">

      <label for="group-name">Groepsnaam</label>

      <input
        type="text"
        id="group-name"
        placeholder="Hoe heet de groep?"
        class="group--name w-4/5 rounded-xl border-2 border-border p-3 mx-5"
        (input)="groupName.set($event.target.value)"
        [value]="groupName()"/>
    </div>
    
    <div class="flex space-between items-center">
      
      <label for="group-description">Omschrijving</label>
       <textarea
        id="group-description"
        rows="5"
        placeholder="Waarvoor is de groep?"
        class="group-description w-4/5 rounded-xl border-2 border-border overflow-y-auto p-3 m-5"
        (input)="groupDescription.set($any($event.target).value)"
        [value]="groupDescription()"></textarea>
    </div>
    
    <div class="flex space-between items-center">
      <label for="email-address-container">Contacten</label>

      <div class="flex flex-col w-full gap-1 mx-5">

        <div class="flex w-full gap-2 justify-between">
          
          <div class="flex flex-col justify-center w-4/5">  
            <input
              type="email"
              [value]="emailAddress()"
              placeholder="contact@org.com"
              class="rounded-xl border-2 border-border w-full p-3 mx-4"
              (keyup)="emailAddress.set($event.target.value)"
              (focus)="errorText.set('');emailAddress.set('')">
            <span class="text-size-timestamp text-action-danger pb-2 mx-7">{{errorText()}}</span>
          </div>
          <img
            src="/assets/img/add_button.svg"
            class="self-start w-1/12 border-2 rounded-full bg-dusk border-gray-200 hover:cursor-pointer hover:bg-dusk-light"
            alt="nieuwe groep toevoegen"
            tabindex="0"
            (click)="emailAddress() && addEmailAddress()"
            (keyup)="emailAddress() && addEmailAddress()">
        </div>

        <div
          id="email-address-container"
          rows="7"
          class="w-full group-description rounded-xl border-2 border-border overflow-y-auto h-40 p-1 mx-4"
        >
          @for (address of emailAddresses(); track $index) {
            <span class="flex items-center justify-between gap-1 p-1 m-1 bg-mist text-text-primary text-xs rounded-full px-3 py-1">   
              {{address}}
              <button
                type="button"
                (click)="deleteEmailAddress($index)"
                class="bg-dusk border border-gray-300 text-paper hover:bg-dusk/50 hover:cursor-pointer transition-colors duration-300 rounded-lg px-1 hover:text-action-danger-text"
                [attr.aria-label]="'Verwijder ' + address">
                <i class="ti ti-x text-sm">verwijder</i>
              </button>
            </span>
          }          
         </div>
      </div>
    </div>
    <div class="flex justify-between gap-1">
      <button
        class="bg-dusk border border-gray-300 text-paper hover:bg-dusk/50 hover:cursor-pointer transition-colors duration-300 px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:text-gray-400 mt-3 ml-[7.3rem] w-1/7"
        (click)="closeDialog()">Terug
      </button>

      <button
        class="bg-dusk border border-gray-300 text-paper hover:bg-dusk/50 hover:cursor-pointer transition-colors duration-300 px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:text-gray-400 mt-3 w-1/7"
        (click)="createNewGroup()">OK
      </button>

    </div>
  </div>
</div>
