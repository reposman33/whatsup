<div class="grid grid-cols-[1fr_auto-1fr]">  
  <div class="col-start-2 font-brand text-size-section-title font-medium text-text-primary">

    Welkom {{authService.currentContact()?.name}}, laatste login was {{authService.currentContact()?.lastSigninTime | date:'EEEE dd LLLL HH:MM:ss':'':'nl-NL'}}
  
  </div>

  @if(authService.currentContact()) {
    <div class="col-start-3 justify-self-end bg-blue-50 border-1 border-blue-100 mb-0.5 rounded-lg p-0.5">
      <svg
      xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" class=" hover:fill-gray-300 transition-colors duration-300 cursor-pointer" 
      (click)="logout()"
      (keyup)="logout()"
      tabindex="0"
      >
        <path d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h299v60H180v600h299v60H180Zm486-185-43-43 102-102H360v-60h363L621-612l43-43 176 176-174 174Z"/>
      </svg>
    </div>
  }
</div>
