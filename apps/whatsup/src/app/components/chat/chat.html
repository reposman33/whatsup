<section class="bg-blue-50 w-3/5 rounded-xl p-3 mb-3" [class]="authService.currentContact()!.registrationTime === chat().sender ? 'float-left bg-blue-100' : 'float-right brightnessbg-green-150'">
      <div class="text-xs italic brightness-50">{{chat().timeStamp | date:'EEEE dd LLLL HH:MM:ss':'':'nl-NL' }}</div>
      {{chat().content}}
  </section>
