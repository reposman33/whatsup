<div class="login-page">
  <div class="login-panel">

    <div class="logo">
      <i class="pi pi-comments"></i>
      <h1>WhatsUp</h1>
    </div>

    <div class="field">
      <label>Email</label>
      <input
        pInputText
        type="email"
        class="login-input"
        (input)="email.set($event.target.value)"
        [value]="email()"
        placeholder="name@example.com"
      />
    </div>

    <div class="field">
      <label>Password</label>
      <input
        pPassword
        (input)="password.set($event.target.value)"
        [value]="password()"
        class="login-password"
        placeholder="Password"
      />
    </div>

    @if(isRegistering()) {
    <div class="field">
      <label>Naam</label>
      <input
        pInputText
        type="text"
        (input)="naam.set($event.target.value)"
        class="register-naam"
        placeholder="Naam"
      />
    </div>
  }
    <div class="flex justify-end gap-2">
      <button
        class="bg-gray-200 border border-gray-300 text-black hover:bg-gray-50 transition-colors duration-300 px-4 py-2 rounded-lg"
        [disabled]="isRegistering() && !isValidRegistration()"
        (click)="register()"
      >Register</button>
      <button
        class="bg-gray-200 border border-gray-300 text-black hover:bg-gray-50 transition-colors duration-300 px-4 py-2 rounded-lg"
        (click)="login()"
      >Sign in</button>
    </div>

  </div>
</div>
