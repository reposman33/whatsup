<div class="flex justify-center">
  <div class="flex h-[80vh] w-[100vw] m-5">
    <aside class="flex flex-col justify-start items-center w-1/5 bg-red-50 rounded-lg pt-3 -3 gap-3 overflow-y-auto">

      @for(user of (apiService.registeredUsers$ | async); track user.registrationTime) {
        <contact [naam]="user.name" [registrationTime]="user.registrationTime" (onRightClick)="handleRightClick($event)"></contact>
      }
    </aside>
    <main class="flex flex-col w-[100%]">
      <section class="h-4/5 bg-blue-50 rounded-lg mb-3">Chats</section>
      <footer class="h-1/5 bg-yellow-50 rounded-lg">Chat input</footer>
    </main>
  </div>
</div>
